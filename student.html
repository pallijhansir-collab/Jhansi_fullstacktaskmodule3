```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Application Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef2f7;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row .form-group {
            flex: 1;
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender label {
            font-weight: normal;
        }

        .gender input {
            width: auto;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn {
            background: #3498db;
        }

        .submit-btn:hover {
            background: #2980b9;
        }

        .reset-btn {
            background: #e74c3c;
        }

        .reset-btn:hover {
            background: #c0392b;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }

        .success {
            display: block !important;
            background: #d4edda;
            color: #155724;
        }

        .error {
            display: block !important;
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Application Form</h1>

        <p class="subtitle">
            Please fill in the details below
        </p>

        <form id="studentForm">

            <!-- Name -->
            <div class="form-group">
                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <!-- Email and Phone -->
            <div class="row">

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        pattern="[0-9]{10}"
                        required
                    >
                </div>

            </div>

            <!-- DOB and Gender -->
            <div class="row">

                <div class="form-group">
                    <label>Date of Birth</label>

                    <input
                        type="date"
                        id="dob"
                        required
                    >
                </div>

                <div class="form-group">

                    <label>Gender</label>

                    <div class="gender">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                                required
                            >
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >
                            Other
                        </label>

                    </div>

                </div>

            </div>

            <!-- Course -->
            <div class="form-group">

                <label>Select Course</label>

                <select id="course" required>

                    <option value="">
                        -- Select Course --
                    </option>

                    <option value="Electrical and Electronics Engineering">
                        Electrical and Electronics Engineering
                    </option>

                    <option value="Computer Science Engineering">
                        Computer Science Engineering
                    </option>

                    <option value="Electronics and Communication Engineering">
                        Electronics and Communication Engineering
                    </option>

                    <option value="Mechanical Engineering">
                        Mechanical Engineering
                    </option>

                    <option value="Civil Engineering">
                        Civil Engineering
                    </option>

                </select>

            </div>

            <!-- Qualification -->
            <div class="form-group">

                <label>Previous Qualification</label>

                <select id="qualification" required>

                    <option value="">
                        -- Select Qualification --
                    </option>

                    <option value="10th">
                        10th
                    </option>

                    <option value="12th">
                        12th
                    </option>

                    <option value="Diploma">
                        Diploma
                    </option>

                </select>

            </div>

            <!-- Address -->
            <div class="form-group">

                <label>Address</label>

                <textarea
                    id="address"
                    placeholder="Enter your complete address"
                    required
                ></textarea>

            </div>

            <!-- City and State -->
            <div class="row">

                <div class="form-group">

                    <label>City</label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>State</label>

                    <input
                        type="text"
                        id="state"
                        placeholder="Enter state"
                        required
                    >

                </div>

            </div>

            <!-- Photo -->
            <div class="form-group">

                <label>Upload Student Photo</label>

                <input
                    type="file"
                    id="photo"
                    accept="image/*"
                    required
                >

            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit Application
                </button>

                <button
                    type="reset"
                    class="reset-btn"
                    onclick="clearMessage()"
                >
                    Reset
                </button>

            </div>

        </form>

        <div id="message"></div>

    </div>


    <script>

        // Form Submit
        document.getElementById("studentForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let name =
                    document.getElementById("name").value;

                let email =
                    document.getElementById("email").value;

                let phone =
                    document.getElementById("phone").value;

                let course =
                    document.getElementById("course").value;

                let message =
                    document.getElementById("message");


                // Phone validation
                if (phone.length !== 10) {

                    message.innerHTML =
                        "❌ Please enter a valid 10-digit phone number.";

                    message.className = "error";

                    return;
                }


                // Success message
                message.innerHTML =
                    "✅ Application submitted successfully!<br><br>" +
                    "Student Name: " + name + "<br>" +
                    "Email: " + email + "<br>" +
                    "Course: " + course;

                message.className = "success";


                // Clear form
                document.getElementById("studentForm").reset();

            });


        // Clear success/error message
        function clearMessage() {

            let message =
                document.getElementById("message");

            message.innerHTML = "";

            message.className = "";

        }

    </script>

</body>

</html>
```
